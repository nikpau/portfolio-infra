services:
    libdse-api:
      image: ghcr.io/nikpau/libdse:latest
      restart: unless-stopped
      volumes:
        - /opt/speech-enhancement/data:/app/data:ro
    
    caddy-gateway:
      build:
        context: .
        dockerfile: Dockerfile.caddy
      restart: unless-stopped
      env_file:
        - .env
      ports:
        - "80:80"
        - "443:443"
        - "443:443/udp" # HTTP/3 support
      volumes:
        - ./Caddyfile:/etc/caddy/Caddyfile
        - caddy_data:/data
        - caddy_config:/config
        - ${PORTFOLIO_STATIC_HTML_TARGET}:/srv/frontend:ro # Mount static HTML files as read-only
        - ${CADDY_LOG_DIR}:/logs # Mount host directory for Caddy logs
        - stats_html:/srv/stats:ro # Mount stats HTML files as read-only
      depends_on:
        - libdse-api
    
    goaccess:
      image: allinurl/goaccess:latest
      restart: unless-stopped
      user: "root" # Run as root to ensure access to Caddy logs
      network_mode: "service:caddy-gateway" # Share network with Caddy for WebSocket support
      volumes:
        - ${CADDY_LOG_DIR}:/logs:ro # Mount Caddy logs as read-only for GoAccess
        - stats_html:/srv/stats # Mount a volume for GoAccess to output HTML stats
      environment:
        - TZ=Europe/Berlin
      command: >
        /logs/access.json
        --log-format=CADDY
        --real-time-html
        --output=/srv/stats/index.html
        --ws-url=${STATS_WS_URL}

volumes:
  caddy_data:
  caddy_config:
  stats_html:
